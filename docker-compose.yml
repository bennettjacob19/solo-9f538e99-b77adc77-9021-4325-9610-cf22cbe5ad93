services:
  origin:
    build: .
    command: uvicorn app.origin.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      # Both versions are exactly this many bytes.
      FIRMWARE_LENGTH: "1048576"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    command: uvicorn app.gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      ORIGIN_BASE_URL: "http://origin:8080"
      GATEWAY_CHUNK_SIZE: "262144"
      GATEWAY_TIMEOUT: "30"
    depends_on:
      origin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
