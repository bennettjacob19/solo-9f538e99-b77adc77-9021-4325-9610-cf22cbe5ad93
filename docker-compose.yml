services:
  origin:
    build: .
    command: uvicorn app.origin.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      # Both versions are exactly this many bytes (8 chunks of 256 KiB).
      FIRMWARE_LENGTH: "2097152"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    command: uvicorn app.gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      ORIGIN_BASE_URL: "http://origin:8080"
      GATEWAY_CHUNK_SIZE: "262144"
      GATEWAY_TIMEOUT: "30"
      # Contiguous missing chunks merged into one upstream Range, at most
      # this many chunks per request.
      GATEWAY_MAX_BATCH_CHUNKS: "4"
    depends_on:
      origin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
